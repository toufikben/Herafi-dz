# Herafi DZ — Automatic APK build
# Builds a release APK on every push to `main` and on manual dispatch.
# Required repository secrets (set in Settings → Secrets and variables → Actions):
#   SUPABASE_URL      e.g. https://unjufkuadbhfdhaepfdl.supabase.co
#   SUPABASE_ANON_KEY e.g. sb_publishable_...

name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail early if Supabase secrets are missing
        if: env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == ''
        run: |
          echo "::error::Required secrets SUPABASE_URL / SUPABASE_ANON_KEY are empty. Set them in Settings > Secrets and variables > Actions."
          exit 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VER=$(grep -oE 'versionName\s*=\s*"[0-9.]+"' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version $VER"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore for release signing
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Debug, OU=Debug, O=HerafiDZ, L=Algiers, ST=Algiers, C=DZ"

      - name: Write Supabase secrets to .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "${SUPABASE_URL}" "${SUPABASE_ANON_KEY}" > .env

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Herafi-DZ-v${{ steps.version.outputs.version }}-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release with APK (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Herafi DZ v${{ steps.version.outputs.version }}
          body: |
            Automated build from commit `${{ github.sha }}`.

            Changes:
            - ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
